<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scan to Join — Antibiotic Awareness Week</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/qr.css">
</head>
<body class="qr-page">
  <div class="qr-card">
    <p class="qr-eyebrow">HOSPITAL SERI MANJUNG • ANTIBIOTIC AWARENESS WEEK</p>
    <h1 class="qr-heading">Join the Campaign</h1>

    <div class="qr-notice">
      <div class="qr-notice-badge">⏳ PLEASE WAIT FOR EMCEE SIGNAL</div>
      <p class="qr-notice-desc">
        <strong>DO NOT ENTER YOUR NAME YET</strong><br>
        Only scan & submit when announced by the emcee!
      </p>
    </div>

    <div id="qrcode"></div>
    <p class="qr-scan">SCAN TO JOIN</p>
    <p class="qr-url" id="qrUrlLabel"></p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/qr.js"></script>
</body>
</html>
